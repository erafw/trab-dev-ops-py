name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run unit tests
      run: |
        pytest

    # ALERTAS (SEMANA 6) 
    - name: Send status alert notification
      if: always()
      run: |
        echo "::warning title=Build Status Alert::Pipeline execution finished with status: ${{ job.status }}"